name: Angular Practice BrowserStack Regression

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Test scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

jobs:
  bstack-test:
    runs-on: ubuntu-latest
    env:
      CI: true
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_CONFIG_FILE: browserstack.yml
      VV_SCOPE: ${{ inputs.scope }}
      BASE_URL: https://rahulshettyacademy.com/angularpractice/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run cross-browser regression on BrowserStack
        run: npm run test:visual-validation:bstack

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
