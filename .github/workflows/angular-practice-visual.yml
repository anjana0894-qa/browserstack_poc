name: Angular Practice Visual Validation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Pipeline Phase
        required: true
        default: compare
        type: choice
        options:
          - baseline
          - compare
      scope:
        description: Test scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

jobs:
  visual-test:
    runs-on: ubuntu-latest
    env:
      CI: true
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      PERCY_SERVER_ADDRESS: http://127.0.0.1:5338
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      VV_SCOPE: ${{ inputs.scope }}
      BASE_URL: https://rahulshettyacademy.com/angularpractice/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Visual Validation Workflow
        run: node scripts/visual-validation/run-workflow.js ${{ inputs.phase }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/