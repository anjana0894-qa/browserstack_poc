name: Angular Practice Visual Validation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Pipeline Phase
        required: true
        default: compare
        type: choice
        options:
          - baseline
          - compare
      scope:
        description: Test scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

jobs:
  visual-test:
    runs-on: ubuntu-latest
    env:
      CI: true
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      VV_SCOPE: ${{ inputs.scope }}
      BASE_URL: https://rahulshettyacademy.com/angularpractice/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Clean up Stale Percy Lock
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const os = require('os');
            const lockFile = path.join(os.homedir(), '.percy', 'agent-5338.lock');
            if (fs.existsSync(lockFile)) {
              fs.unlinkSync(lockFile);
              console.log('Removed stale Percy lock file.');
            }
          "
        continue-on-error: true

      - name: Run Visual Validation Workflow
        run: node scripts/visual-validation/run-workflow.js ${{ inputs.phase }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/